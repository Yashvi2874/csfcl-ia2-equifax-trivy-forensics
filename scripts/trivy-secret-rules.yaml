# Custom Trivy secret-detection rules for the ACIS investigation.
# Models Equifax failure #3: database credentials stored in plaintext.
rules:
  - id: acis-db-password
    category: ACIS
    title: ACIS database password stored in plaintext configuration
    severity: CRITICAL
    keywords:
      - db.password
    regex: '(?i)(acis|consumer|audit)\.db\.password\s*=\s*(?P<secret>\S+)'

  - id: acis-session-secret
    category: ACIS
    title: Application session secret committed to configuration
    severity: HIGH
    keywords:
      - SESSION_SECRET
    regex: 'SESSION_SECRET\s*=\s*(?P<secret>\S+)'
