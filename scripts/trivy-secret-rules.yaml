# Custom Trivy secret rules for the ACIS investigation.
# Trivy's built-in rules know token formats like AWS keys, but not an
# application's own property names, so the plaintext database passwords in
# database.properties need their own rule.
rules:
  - id: acis-db-password
    category: ACIS
    title: Database password stored in plaintext configuration
    severity: CRITICAL
    keywords:
      - password
    # The optional middle segment catches acis.db.readonly.password as well
    # as acis.db.password. The first version of this rule missed it.
    regex: '(?i)(acis|consumer|audit)\.db\.(?:[a-z]+\.)?password\s*=\s*(?P<secret>\S+)'

  - id: acis-session-secret
    category: ACIS
    title: Application session secret committed to configuration
    severity: HIGH
    keywords:
      - SESSION_SECRET
    regex: 'SESSION_SECRET\s*=\s*(?P<secret>\S+)'
